name: Weekly Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: weekly-predictions
  cancel-in-progress: false

jobs:
  run-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TF_ENABLE_ONEDNN_OPTS: "0"
      OMP_NUM_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply migrations
        run: python backend/python/migrate_db.py

      - name: Count existing player seasons
        id: db_counts
        run: |
          python - <<'PY'
          import os
          import psycopg

          database_url = os.environ["DATABASE_URL"]
          with psycopg.connect(database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute("select count(*) from player_seasons;")
                  season_count = int(cur.fetchone()[0] or 0)

          print(f"player_seasons count: {season_count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"season_count={season_count}\n")
          PY

      - name: Import player JSONs into DB (bootstrap if empty or forced)
        if: ${{ steps.db_counts.outputs.season_count == '0' || vars.IMPORT_PLAYERS_FROM_REPO == 'true' }}
        run: python backend/python/import_players_to_db.py

      - name: Generate and store predictions
        run: >-
          python backend/python/main.py
          --data-source db
          --output-target db
          --all-active
          --epochs 120
          --batch-size 16
          --window-size 4
          --retirement-age 40
          --run-type scheduled
          --triggered-by github-actions
          --model-version gru-v2
