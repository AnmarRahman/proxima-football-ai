name: Train Tier A Candidate Model

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "New candidate version, for example tier-a-v2"
        required: true
        type: string

jobs:
  train-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Apply migrations
        run: python backend/python/migrate_db.py

      - name: Export deterministic training data
        run: python backend/python/export_tier_a_from_db.py --output /tmp/tier-a-training.csv

      - name: Train candidate without promoting it
        run: >-
          python backend/python/train_production_models.py
          --dataset /tmp/tier-a-training.csv
          --output-dir /tmp/${{ inputs.model_version }}
          --model-version ${{ inputs.model_version }}

      - name: Upload candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model_version }}
          path: /tmp/${{ inputs.model_version }}
          if-no-files-found: error
