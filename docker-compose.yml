services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proxima-app
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      NODE_ENV: production
      PORT: 4040
      HOSTNAME: 0.0.0.0
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-postgres}
      POSTGREST_URL: ${POSTGREST_URL:-http://postgrest:3000}
      POSTGREST_API_KEY: ${POSTGREST_API_KEY:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ADMIN_DASHBOARD_PASSWORD: ${ADMIN_DASHBOARD_PASSWORD:-change-me}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-me}
      GITHUB_ACTIONS_TOKEN: ${GITHUB_ACTIONS_TOKEN:-}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-}
      GITHUB_WORKFLOW_ID: ${GITHUB_WORKFLOW_ID:-weekly-predictions.yml}
      GITHUB_WORKFLOW_REF: ${GITHUB_WORKFLOW_REF:-main}
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: proxima-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxima_password}
      POSTGRES_DB: ${POSTGRES_DB:-proxima_ai}
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./proxima_postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxima} -d ${POSTGRES_DB:-proxima_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:latest
    container_name: proxima-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-proxima}:${POSTGRES_PASSWORD:-proxima_password}@postgres:5432/${POSTGRES_DB:-proxima_ai}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-proxima}
      PGRST_SERVER_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres-seed:
    image: python:3.11-slim
    working_dir: /repo
    volumes:
      - ./:/repo:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-proxima}:${POSTGRES_PASSWORD:-proxima_password}@postgres:5432/${POSTGRES_DB:-proxima_ai}
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      bash -lc "
      pip install --no-cache-dir 'psycopg[binary]>=3.2.0' &&
      python backend/python/migrate_db.py &&
      python backend/python/import_players_to_db.py --players-dir backend/python/data/players
      "

